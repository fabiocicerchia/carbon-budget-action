name: carbon-budget-action
description: >-
  CI gate that fails when the estimated carbon footprint of a deployment
  exceeds a budget — bundle-size checks, but for carbon.
author: Fabio Cicerchia
branding:
  icon: cloud
  color: green
inputs:
  budget-gco2e:
    description: Maximum allowed footprint per deploy in gCO2e
    required: true
  grid-intensity:
    description: gCO2e/kWh of the target region's grid (default world average)
    default: "480"
  em-zone:
    description: >-
      Electricity Maps zone (e.g. FR, US-VA — same codes as
      carbon-region-picker) to fetch live grid intensity for, overriding
      grid-intensity. Requires em-token.
    default: ""
  em-token:
    description: Electricity Maps API token, e.g. pass a repo secret holding it
    default: ""
  ci-api-area:
    description: >-
      ISO country code (IT, US, DEU) to fetch live grid intensity for from
      ci-api.fabiocicerchia.it, overriding grid-intensity. Needs no
      credentials. Append a bidding zone or balancing region to narrow it —
      IT/SICI, SE/SE3, US/ERCO, AU/NSW1 — which falls back to the country when
      that zone has no reading for the hour. Ignored when em-zone and em-token
      are both set.
    default: ""
  replicas:
    description: Number of replicas the deployment will run
    default: "1"
  cpu-request:
    description: CPU request per replica (e.g. 500m, 2)
    default: "500m"
  memory-request:
    description: Memory request per replica (e.g. 512Mi, 2Gi)
    default: "512Mi"
  manifest-path:
    description: >-
      Path to a k8s Deployment/StatefulSet manifest to read replicas/cpu/memory
      requests from (overrides replicas/cpu-request/memory-request)
    default: ""
  hours:
    description: Hours the workload runs per deploy cycle (default 720 = 30d)
    default: "720"
  mode:
    description: "gate (fail over budget) or report (never fail)"
    default: gate
  base-gco2e:
    description: Base-branch estimate (gCO2e) to render a Δ against
    default: ""
  pr-comment:
    description: Post/update a PR comment with the summary (needs github-token)
    default: "false"
  github-token:
    description: Token for posting the PR comment, e.g. pass the workflow's github.token
    default: ""
  embodied-gco2e:
    description: >-
      Total embodied (manufacturing) carbon of ONE replica's underlying
      server, in gCO2e. Amortized over embodied-lifetime-years and added to
      the estimate.
    default: "0"
  embodied-lifetime-years:
    description: Expected hardware lifetime used to amortize embodied-gco2e
    default: "4"
  track-budget:
    description: >-
      Error-budget mode: budget-gco2e applies to the window's running total
      (burned-gco2e + this run's estimate), not just this run alone. Meant
      for a deploy step, not a PR check — already-running workloads aren't
      affected either way; this only decides whether *this* deploy proceeds.
    default: "false"
  burned-gco2e:
    description: >-
      gCO2e already burned in the current window — pass back this action's
      own burned-gco2e output from the last run (same pattern as base-gco2e;
      this action stores no state of its own).
    default: "0"
  window-start:
    description: >-
      ISO-8601 start of the current window — pass back this action's own
      window-start output from the last run. Left empty (or once hours has
      elapsed since it) the window resets and burned-gco2e starts over at 0.
    default: ""
outputs:
  estimated-gco2e:
    description: Estimated footprint in gCO2e
    value: ${{ steps.run.outputs.estimated-gco2e }}
  within-budget:
    description: "true/false"
    value: ${{ steps.run.outputs.within-budget }}
  burned-gco2e:
    description: >-
      New running total for the window (only set when track-budget is true)
      — persist and pass back in as burned-gco2e on the next run.
    value: ${{ steps.run.outputs.burned-gco2e }}
  window-start:
    description: >-
      Window start to persist and pass back in as window-start on the next
      run (only set when track-budget is true).
    value: ${{ steps.run.outputs.window-start }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        BUDGET_GCO2E: ${{ inputs.budget-gco2e }}
        GRID_INTENSITY: ${{ inputs.grid-intensity }}
        EM_ZONE: ${{ inputs.em-zone }}
        EM_TOKEN: ${{ inputs.em-token }}
        CI_API_AREA: ${{ inputs.ci-api-area }}
        REPLICAS: ${{ inputs.replicas }}
        CPU_REQUEST: ${{ inputs.cpu-request }}
        MEMORY_REQUEST: ${{ inputs.memory-request }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        HOURS: ${{ inputs.hours }}
        MODE: ${{ inputs.mode }}
        BASE_GCO2E: ${{ inputs.base-gco2e }}
        PR_COMMENT: ${{ inputs.pr-comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        EMBODIED_GCO2E: ${{ inputs.embodied-gco2e }}
        EMBODIED_LIFETIME_YEARS: ${{ inputs.embodied-lifetime-years }}
        TRACK_BUDGET: ${{ inputs.track-budget }}
        BURNED_GCO2E: ${{ inputs.burned-gco2e }}
        WINDOW_START: ${{ inputs.window-start }}
      run: python ${{ github.action_path }}/carbon_budget.py
