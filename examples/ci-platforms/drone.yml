# Drone — carbon budget gate on every pull request.
# Copy into .drone.yml at the repo root.
#
# Woodpecker CI runs the same steps: drop the `kind`/`type`/`name` header, keep
# `steps:` as-is, rename `trigger.event` values if you use Woodpecker's own
# (`pull_request` is the same), and save it as .woodpecker.yml.
kind: pipeline
type: docker
name: default

steps:
  - name: carbon-budget
    image: python:3.13-alpine
    environment:
      BUDGET_GCO2E: 5000
      REPLICAS: 4
      CPU_REQUEST: 500m
      MEMORY_REQUEST: 1Gi
      GRID_INTENSITY: 56 # eu-north-1; default 480 (world average)
    commands:
      - wget -qO carbon_budget.py https://raw.githubusercontent.com/fabiocicerchia/carbon-budget-action/v0.2.0/carbon_budget.py
      # Exit 1 over budget in gate mode — that is the whole gate.
      - python3 carbon_budget.py

trigger:
  event:
    - pull_request
    - push
