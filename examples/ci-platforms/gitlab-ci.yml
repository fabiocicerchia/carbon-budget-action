# GitLab CI — carbon budget gate on every merge request.
# Copy into .gitlab-ci.yml (or `include:` it from one).
stages:
  - check

carbon-budget:
  stage: check
  image: python:3.13-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    BUDGET_GCO2E: "5000"
    REPLICAS: "4"
    CPU_REQUEST: "500m"
    MEMORY_REQUEST: "1Gi"
    GRID_INTENSITY: "56" # eu-north-1; default 480 (world average)
    # MODE: report          # never fail the pipeline — the adoption on-ramp
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/*
    - curl -fsSL -o carbon_budget.py
      https://raw.githubusercontent.com/fabiocicerchia/carbon-budget-action/v0.2.0/carbon_budget.py
  script:
    # Exit 1 over budget in gate mode — that is the whole gate.
    - python3 carbon_budget.py | tee carbon-budget.md
  artifacts:
    when: always
    paths:
      - carbon-budget.md
    expire_in: 1 week
